[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py benchmark_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    slow: marks tests as slow (>1s) - deselect with '-m "not slow"'
    benchmark: performance benchmark tests
    unit: unit tests for library and helper functions
    integration: integration tests that test multiple components

# Default options
addopts =
    -v
    --strict-markers
    --tb=short
    --import-mode=importlib

# Ignore certain directories
norecursedirs = .git .tox venv* __pycache__ *.egg-info
