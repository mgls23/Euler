# Project Euler Performance Benchmarks
# All times in milliseconds
# Categories: Elite, Good, Acceptable, Needs Optimization

metadata:
  description: "Performance benchmarks for Project Euler solutions"
  last_updated: "2025-01-09"
  author: "Tae"

# Global thresholds (default for uncategorized problems)
global_thresholds:
  elite: 10         # < 10ms
  good: 100         # < 100ms  
  acceptable: 1000  # < 1s
  # > 1s = needs optimization

